<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница с меню и фреймом</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            background-color: #f9f9f9;
        }
        .container {
            display: flex;
            height: 100vh;
        }

        /* Стили для бокового меню */
        .sidebar {
            height: 100%;
            width: 260px;
            background-color: #005c33; /* Более насыщенный зеленый для контраста */
            padding: 30px 20px;
            color: #fff;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1); /* Тень для эффекта глубины */
        }
        .sidebar h2 {
            font-size: 24px;
            margin-bottom: 25px;
            border-bottom: 2px solid #fff;
            padding-bottom: 10px;
        }
        .sidebar ul {
            list-style-type: none;
        }
        .sidebar ul li {
            margin-bottom: 18px;
        }
        .sidebar ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            display: block;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .sidebar ul li a:hover {
            background-color: #007b3e; /* Меняется цвет фона при наведении */
            color: #e0e0e0;
            text-decoration: none;
        }

        /* Стили для контента */
        .content {
            background-color: #fff;
            flex-grow: 1;
            padding: 30px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05); /* Легкий внутренний эффект тени */
            border-radius: 12px;
            margin: 20px;
        }

        /* Стили для фрейма */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Тень вокруг iframe */
            transition: box-shadow 0.3s ease;
        }
        iframe:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2); /* Увеличение тени при наведении */
        }

        /* Общие стили */
        h1, h2, h3 {
            color: #fff;
            font-weight: 700;
        }
        p, li {
            font-size: 16px;
            line-height: 1.6;
        }
        a {
            color: #005c33;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

<div class="container">
    <!-- Боковое меню -->
    <div class="sidebar">
        <h2>Меню</h2>
        <ul>
            <li><a href="memberships.html" target="contentFrame">Абонементы</a></li>
            <li><a href="visitors.html" target="contentFrame">Посетители</a></li>
        <!--<li><a href="" target="contentFrame">Занятия</a></li>
            <li><a href="schedule.html" target="contentFrame">Расписание занятий</a></li> -->
        </ul>
    </div>

    <!-- Основное содержимое с фреймом -->
    <div class="content">
        <iframe name="contentFrame" src="memberships.html"></iframe>
    </div>
</div>

</body>
</html>
