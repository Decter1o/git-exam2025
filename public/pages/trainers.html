    <div class="main-box">
        <h1>Тренера</h1>
        <div class="tools">
            <div id="search-form" class="search-form">
                <input id="search-input" type="text" placeholder="Введите имя, фамилию или номер телефона...">
                <button id="search-button" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="button-box">
                <button id="add-trainer" class="button"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>
        <table id="trainersTable">
            <thead>
                <tr>
                    <th>Имя</th>
                    <th>Фамилия</th>
                    <th>Тип тренировок</th>
                    <th>Номер телефона</th>
                    <th>Социальные сети</th>
                    <th>Описание</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
