<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренера</title>
    <link rel="stylesheet" href="/public/css/trainers.css">
    <link rel="stylesheet" href="/public/css/fontawesome-free-6.7.2-web/css/all.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/StephanWagner/jBox@v1.3.2/dist/jBox.all.min.js" defer></script>
    <link href="https://cdn.jsdelivr.net/gh/StephanWagner/jBox@v1.3.2/dist/jBox.all.min.css" rel="stylesheet">
    <script src="/public/js/trainers.js" defer></script>
</head>
<body>
    <div class="main-box">
        <h1>Тренера</h1>
        <div class="tools">
            <div id="search-form" class="search-form">
                <input id="search-input" type="text" placeholder="Введите имя, фамилию или номер телефона...">
                <button id="search-button" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="button-box">
                <button id="add-trainer" class="button"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>
        <table id="trainersTable">
            <thead>
                <tr>
                    <th>Имя</th>
                    <th>Фамилия</th>
                    <th>Тип тренировок</th>
                    <th>Номер телефона</th>
                    <th>Социальные сети</th>
                    <th>Описание</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</body>
</html>
