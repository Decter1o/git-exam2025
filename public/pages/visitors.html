<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/public/css/visitors.css">
    <link rel="stylesheet" href="/public/css/fontawesome-free-6.7.2-web/css/all.css">
    <script src="/public/js/visitors.js" defer></script>
</head>
<body>
    <div class="main-box">
        <h1>Посетители</h1>
        <div class="tools">
            <div id="search-form" class="search-form">
                <input id="search-input" type="text" placeholder="Введите имя, фамилию или номер телефона...">
                <button id="search-button" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="button-box">
                <button id="add-user" class="button"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>
        <table id="visitorsTable">
            <thead>
                <tr>
                    <th>Имя</th>
                    <th>Фамилия</th>
                    <th>Телефон</th>
                    <th>Абонемент</th>
                    <th>Остаток</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</body>
</html>
