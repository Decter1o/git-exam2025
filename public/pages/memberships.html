<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление абонементами</title>
    <link rel="stylesheet" href="/public/css/memberships.css">
    <script src="/public/js/memberships.js" defer></script>
</head>
<body>
    <h1>Абонементы</h1>

    <!-- Таблица для отображения абонементов -->
    <table id="gymMembershipsTable">
        <thead>
        <tr>
            <th>Тип</th>
            <th>Длительность</th>
            <th>Цена</th>
            <th>Группа</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- Форма для добавления или редактирования абонементов -->
    <form id="membershipForm">
        <h2>Добавить/Изменить абонемент</h2>
        <div class = "box">
            <select id="type" required>
                <option value="">Тип абонемента</option>
                <option value="дневной">Дневной</option>
                <option value="стандарт">Стандарт</option>
                <option value="безлимит">Безлимит</option>
            </select>
            <select id="duration" required>
                <option value="">Длительность</option>
                <option value="разовый">Разовый</option>
                <option value="1 месяц">1 месяц</option>
                <option value="3 месяца">3 месяца</option>
                <option value="6 месяцев">6 месяцев</option>
                <option value="1 год">1 год</option>
            </select>
            <input type="number" id="price" placeholder="Цена" required>
            <select id="specialGroup" required>
                <option value="">Группа</option>
                <option value="стандарт">Стандарт</option>
                <option value="золотой возраст">Золотой возраст</option>
            </select>
        </div>
        <button type="submit">Сохранить</button>
    </form>
</body>
</html>
