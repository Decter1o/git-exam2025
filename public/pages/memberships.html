<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>Управление абонементами</title>
    <link rel="stylesheet" href="/public/css/memberships.css">
    <link rel="stylesheet" href="/public/css/fontawesome-free-6.7.2-web/css/all.css">
    <script src="/public/js/memberships.js" defer></script>
</head>
<body>
    <h1>Абонементы</h1>

    <table id="gymMembershipsTable">

        <tr>
            <th class="sortable">Тип <i class="fa-solid fa-sort"></i></th>

            <th class="sortable">Цена <i class="fa-solid fa-sort"></i></th>
            <th class="sortable">Группа <i class="fa-solid fa-sort"></i></th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

</html>
